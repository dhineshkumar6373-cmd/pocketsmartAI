{% extends 'base.html' %}{% block title %}Sign in — PocketSmart{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><form id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary full" type="submit">Sign in →</button></form><p id="formMessage" class="message"></p><p class="muted">Don't have an account? <a href="/register">Create one</a></p></div></section>{% endblock %}
{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit', async e=>{e.preventDefault();const f=e.currentTarget;const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:f.username.value,password:f.password.value})});if(r.ok)location.href='/dashboard';else showMessage(r.data?.detail||'Login failed',true);});</script>{% endblock %}
