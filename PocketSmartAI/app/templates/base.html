<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}PocketSmart AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">💼 PocketSmart</a>
  {% if user %}
  <nav>
    <a href="/dashboard">Dashboard</a><a href="/home-planner">Home</a><a href="/party-planner">Party</a><a href="/jewelry-planner">Jewelry</a><a href="/history">History</a>
    <button class="link-button" onclick="logout()">Logout</button>
  </nav>
  {% else %}
  <nav><a href="/login">Sign in</a><a class="nav-cta" href="/register">Get started</a></nav>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="footer"><strong>PocketSmart AI</strong><span>Budget-aware planning for everyday needs.</span><span>© 2026 PocketSmart</span></footer>
<script src="{{ url_for('static', path='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
