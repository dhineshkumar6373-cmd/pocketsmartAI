{% extends 'base.html' %}{% block title %}Create account — PocketSmart{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><form id="registerForm"><label>Username<input name="username" required minlength="3"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required minlength="8"></label><label>Confirm password<input name="confirm_password" type="password" required minlength="8"></label><button class="btn primary full" type="submit">Create account</button></form><p id="formMessage" class="message"></p><p class="muted">Already have an account? <a href="/login">Sign in</a></p></div></section>{% endblock %}
{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit', async e=>{e.preventDefault();const f=e.currentTarget;const payload={username:f.username.value,email:f.email.value,password:f.password.value,confirm_password:f.confirm_password.value};const r=await api('/api/auth/register',{method:'POST',body:JSON.stringify(payload)});if(r.ok){location.href='/login';}else showMessage(r.data?.detail||'Registration failed',true);});</script>{% endblock %}
